<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amaze Arrow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="mid">Amaze Arrow</div><div class="by">Ibraheem Junejo</div></div>

<div id="home" hidden>
  <h1>Amaze Arrow</h1>
  <div id="strip"></div>
  <button id="play"><b>Play</b><small id="plv">Level 1</small></button>
</div>

<div id="game" hidden>
  <div id="top">
    <button id="back" aria-label="Back">←</button>
    <span id="lv">Level 1</span>
    <button id="hint" aria-label="Hint">💡</button>
  </div>
  <div id="drops"></div>
  <p id="note">Play for 30 minutes, then rest and sleep well.</p>
  <div id="board"><canvas id="cv"></canvas></div>
</div>

<div id="ov" hidden>
  <div id="box"><h2 id="ot"></h2><p id="os"></p><button id="ob"></button></div>
</div>

<script src="game.js"></script>
</body>
</html>
